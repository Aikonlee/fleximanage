name: Validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint -- --max-warnings=0
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --audit-level=moderate
        working-directory: frontend
      - run: test ! -e build/direct-login.html && test ! -e build/fix-auth.html
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build
          retention-days: 7
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mongo:
        image: mongo:7
        options: >-
          -p 127.0.0.1:27099:27017
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' | grep -q 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: backend
      - name: Assert legacy backup auth HTML files do not exist
        working-directory: backend
        run: test ! -e public_backup/direct-login.html && test ! -e public_backup/fix-auth.html
      - run: npm run test:regression
        working-directory: backend
      - run: npm run test:models
        working-directory: backend
      - run: npm run test:historical
        working-directory: backend
      - name: Run full backend Jest test suite
        working-directory: backend
        env:
          REDIS_URL: redis://127.0.0.1:6379/15
          TEST_REDIS_URL: redis://127.0.0.1:6379/15
          MONGO_SESSION_TEST_URL: mongodb://127.0.0.1:27099/flexi_session_test
        run: npm test -- --runInBand --forceExit --setupFiles ./tools/test-models-setup.cjs
      - name: Verify session replay/revocation MongoDB integration suite ran
        working-directory: backend
        env:
          MONGO_SESSION_TEST_URL: mongodb://127.0.0.1:27099/flexi_session_test
        run: |
          npx jest tests/auth-sessions.mongo.test.js --runInBand --json --outputFile=/tmp/auth-sessions-mongo-report.json
          node -e '
            const r = require("/tmp/auth-sessions-mongo-report.json");
            if (!r.success || r.numPassedTests < 1 || r.numPendingTests > 0) {
              console.error("Session MongoDB integration test did not execute cleanly:", {
                success: r.success,
                passed: r.numPassedTests,
                pending: r.numPendingTests,
                failed: r.numFailedTests
              });
              process.exit(1);
            }
          '
      - name: Record dependency audit
        working-directory: backend
        run: |
          npm audit --json > audit-all.json || true
          npm audit --omit=dev --json > audit-production.json || true
          node tools/check-audit.cjs audit-production.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-audit
          path: backend/audit-*.json
          retention-days: 14
