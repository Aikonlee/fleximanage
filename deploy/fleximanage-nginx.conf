# This file is included from nginx.conf's http context.
map $http_upgrade $fleximanage_connection_upgrade {
    default upgrade;
    '' close;
}

# Empty keys are not accounted. OPTIONS and unrelated routes stay unrestricted
# by these edge buckets; the application's global limiter still applies.
map "$request_method:$uri" $flexi_login_key {
    default "";
    ~*^POST:/api/users/(login|auth)/?$ $binary_remote_addr;
}
map "$request_method:$uri" $flexi_reset_key {
    default "";
    ~*^POST:/api/users/reset-password/?$ $binary_remote_addr;
}
map "$request_method:$uri" $flexi_mfa_key {
    default "";
    ~*^POST:/api/users/mfa/(verify|verifyRecoveryCode)/?$ $binary_remote_addr;
}
map "$request_method:$uri" $flexi_signup_key {
    default "";
    ~*^POST:/api/users/(register|reverify-account)/?$ $binary_remote_addr;
}
map "$request_method:$uri" $flexi_verify_key {
    default "";
    ~*^POST:/api/users/verify-account/?$ $binary_remote_addr;
}
limit_req_zone $flexi_login_key zone=flexi_login:10m rate=10r/m;
limit_req_zone $flexi_reset_key zone=flexi_reset:10m rate=6r/m;
limit_req_zone $flexi_mfa_key zone=flexi_mfa:10m rate=12r/m;
limit_req_zone $flexi_signup_key zone=flexi_signup:10m rate=5r/m;
limit_req_zone $flexi_verify_key zone=flexi_verify:10m rate=10r/m;

# Query-free access log format so reset/verify tokens in query strings are never logged.
log_format fleximanage_no_query '$remote_addr - $remote_user [$time_local] '
    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
    '"-" "$http_user_agent"';

server {
    listen 127.0.0.1:14443 ssl;
    listen 0.0.0.0:3443 ssl;
    server_name manage.miwide.com;
    ssl_certificate /etc/letsencrypt/live/manage.miwide.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/manage.miwide.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Reject unknown HTTP hosts even if the TLS handshake used this certificate.
    if ($host != manage.miwide.com) { return 444; }

    access_log /var/log/nginx/access.log fleximanage_no_query;
    client_max_body_size 50m;
    limit_req_status 429;

    # Documentation is served by a dedicated web server; no local docs route.
    location ^~ /docs {
        return 404;
    }

    location / {
        limit_req zone=flexi_login burst=10 nodelay;
        limit_req zone=flexi_reset burst=6 nodelay;
        limit_req zone=flexi_mfa burst=8 nodelay;
        limit_req zone=flexi_signup burst=5 nodelay;
        limit_req zone=flexi_verify burst=10 nodelay;
        # The application attaches its WebSocket server to the HTTP listener
        # when SHOULD_REDIRECT_HTTPS is disabled in this deployment.
        proxy_pass http://127.0.0.1:13000;
        proxy_http_version 1.1;
        # Successful login returns JWT/refresh tokens in response headers plus
        # cookies; the default 4k/8k header buffer makes nginx return 502.
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_set_header Host manage.miwide.com:3443;
        proxy_set_header X-Forwarded-Host manage.miwide.com:3443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $fleximanage_connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
